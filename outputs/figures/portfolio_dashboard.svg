<text x="847.0" y="639.0" class="panel-title" text-anchor="start">What the model supports</text>
<text x="847.0" y="672.0" class="takeaway" text-anchor="start">• Unemployment: +72.1 per 100k (p=0.008)</text>
<text x="847.0" y="700.0" class="takeaway" text-anchor="start">• Income: -32.1 per 100k (p=0.075)</text>
<text x="847.0" y="735.0" class="small" text-anchor="start">Income is directionally negative but not conclusive at α=.05</text>
<text x="847.0" y="759.0" class="small" text-anchor="start">The model explains a modest share of cross-state variation</text>
<text x="847.0" y="783.0" class="small" text-anchor="start">No causal claim: reporting, omitted variables, and ecology matter</text>
<text x="847.0" y="812.0" class="note" text-anchor="start">Primary model excludes seven states below the 90% coverage floor</text>
<text x="55.0" y="875.0" class="note" text-anchor="start">Sources: FBI Crime Data Explorer monthly UCR submissions; U.S. Census Bureau 2023 ACS 1-year tables B19013 and B23025.</text>
